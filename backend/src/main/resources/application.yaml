jwt:
  public:
    key: "classpath:app.pub"
  private:
    key: "classpath:app.key"
    
recomendacao:
  embedding:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

spring:
  application:
    name: selectaapi

  config:
    import: "optional:file:./.env[.properties],optional:file:./backend/.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED:false}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          multiplier: 10
          max-interval: 10000ms

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-not-configured}
            client-secret: ${GOOGLE_SECRET_KEY:google-client-secret-key-is-not-configured}
            scope:
              - profile
              - email

          linkedin:
            client-id: ${LINKEDIN_CLIENT_ID:linkedin-client-id-not-configured}
            client-secret: ${LINKEDIN_CLIENT_SECRET:linkedin-client-secret-not-configured}
            client-name: LinkedIn
            provider: linkedin
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

        provider:
          linkedin:
            issuer-uri: https://www.linkedin.com/oauth

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  seed:
    enabled: true
r2:
  endpoint: ${R2_ENDPOINT:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:}
  public-base-url: ${R2_PUBLIC_BASE_URL:}

resend:
  api:
    key: ${API_KEY}
logging:
  level:
    # Se você estiver usando RestTemplate
    org.springframework.web.client.RestTemplate: DEBUG
    # Se você estiver usando WebClient
    org.springframework.web.reactive.function.client.ExchangeFunctions: TRACE
    # Se você estiver usando RestClient (Spring Boot 3.2+)
    org.springframework.web.client.RestClient: DEBUG
    # Opcional: Para ver o corpo (body) das requisições HTTP
    org.apache.hc.client5.http.wire: DEBUG